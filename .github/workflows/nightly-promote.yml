# Nightly promotion of release/develop into main (owner decision
# 2026-11-19, amended 2026-11-26). PRs land in release/develop (squash
# only, 3.11 CI). Each night this job first syncs main into
# release/develop when release/develop is strictly behind main and
# their trees differ, through a squash PR — the only way main's content
# can land on a linear-history branch (a squash imports content, not
# history). Then it opens or reuses a PR from nightly/promote into main
# and dispatches the full 3.11-3.15 CI on it. GitHub auto-merges it
# with a regular merge commit only once the required `ci` check is
# green.
#
# Schedule: 09:00 UTC = 04:00 Eastern Standard Time (owner request
# 2026-11-26). GitHub cron is UTC-only, so during US daylight time
# (EDT, UTC-4) this runs at 05:00 EDT. Scheduled runs can start late
# under load.
#
# Why nightly/promote and not release/develop as the PR head: main
# requires branches to be up to date (strict `ci`). Each promotion adds a
# merge commit to main. release/develop takes only squash PR merges
# (classic protection with linear history + ruleset 27675422, no bypass
# actors), so the nightly sync below contributes a squash commit via a
# PR — the only way main's content can land there (owner request
# 2026-11-26). So the job builds the head branch as main plus a merge of
# release/develop. Its merge commit carries a Signed-off-by line and is
# checked by the dco job like any other commit.
#
# Security: no checkout and no repository code runs here. It only makes
# GitHub API calls with the short-lived GITHUB_TOKEN, scoped to this job.
# No secrets, no PAT, no App, no branch-protection bypass. For the
# promotion, the merge goes through main's normal protection (required
# `ci`, up to date, conversation resolution). The sync opens a PR of
# main into release/develop and enables squash auto-merge, so the
# branch's own gates (required `ci`, squash-only) still apply; it
# introduces no authored content beyond main's commits. Schedule and
# manual runs on main only.
# nightly/promote is guarded by a ruleset (only the GitHub Actions app may
# create, update or delete it), and this job also re-checks its contents
# and pins auto-merge to the exact SHA it built (H-52-1).
name: nightly-promote

on:
  schedule:
    # 09:00 UTC = 04:00 EST (05:00 EDT during daylight saving).
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-promote
  cancel-in-progress: false

jobs:
  promote:
    name: promote
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create/update nightly/promote, and the sync branch + PR for the sync
      pull-requests: write   # open the PR and enable auto-merge
      actions: write         # dispatch ci.yml on nightly/promote
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BR: nightly/promote
      SOB: "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
    steps:
      - name: Sync release/develop with main (owner request 2026-11-26)
        # release/develop enforces linear history and squash-only PR
        # merges (classic protection + ruleset 27675422, no bypass
        # actors), so the merges API cannot add a merge commit to it.
        # Sync through the one merge method the branch allows: a squash
        # PR of main into release/develop. The sync branch sits at
        # main's tip; the PR's own pull_request CI (3.11) is the branch's
        # required `ci` check. The squash commit message carries the
        # sync prefix and a Signed-off-by line, so the promotion's dco
        # job (range merge-base(main)..HEAD on push to release/develop)
        # passes and the promotion gate below excludes it from the real
        run: |
          set -euo pipefail
          # Direction guard first: sync only when release/develop is
          # strictly behind main (compare status "behind" = an ancestor
          # of main, i.e. main is content-ahead and this is a genuine
          # forward sync). "ahead" or "diverged" means release/develop
          # has newer content the promotion will carry to main — a sync
          # PR main->release/develop in that state would DELETE that
          # newer content (a rollback), so it must never open.
          status="$(gh api "repos/$REPO/compare/main...release/develop" --jq .status)"
          if [ "$status" != "behind" ]; then
            echo "release/develop is not behind main (compare status: $status); skipping the sync so it cannot roll back release/develop's newer content"
            exit 0
          fi
          # Trigger on content, not on commit history: a squash sync
          # imports main's content but not its history, so behind_by
          # never reaches 0 — comparing the two tip trees is what
          # actually says "current".
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          rd_sha="$(gh api "repos/$REPO/git/ref/heads/release/develop" --jq .object.sha)"
          main_tree="$(gh api "repos/$REPO/commits/$main_sha" --jq .commit.tree.sha)"
          rd_tree="$(gh api "repos/$REPO/commits/$rd_sha" --jq .commit.tree.sha)"
          if [ "$main_tree" = "$rd_tree" ]; then
            echo "release/develop is content-current with main"
            exit 0
          fi
          echo "release/develop content differs from main; opening or refreshing the sync PR"
          SB="sync/main-into-release-develop"
          if gh api "repos/$REPO/git/ref/heads/$SB" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$SB" -f sha="$main_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$SB" -f sha="$main_sha" >/dev/null
          fi
          pr="$(gh pr list --repo "$REPO" --head "$SB" --base release/develop --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create --repo "$REPO" --base release/develop --head "$SB" \
              --title "Sync main into release/develop (nightly)" \
              --body "Automated nightly sync (owner request 2026-11-26): a squash of main into release/develop, so release/develop is content-current with main. Auto-merges once release/develop's own gates are met — the required ci check and any review the branch's ruleset asks for.")"
            pr="${url##*/}"
          fi
          if gh api -X PUT "repos/$REPO/pulls/$pr/auto-merge" \
            -f merge_method=squash \
            -f commit_title="Sync main into release/develop (nightly) (#$pr)" \
            -f commit_message="$(printf 'Automated nightly sync of main into release/develop (owner request 2026-11-26).\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>')" \
            > /dev/null; then
            echo "sync PR #$pr: squash auto-merge enabled"
          else
            echo "::warning::sync PR #$pr could not enable squash auto-merge; leaving it open for the next nightly run"
          fi

      - name: Open or reuse the promotion PR and start full CI
        run: |
          set -euo pipefail
          # Count only real (single-parent) commits that are not nightly
          # sync squashes: a sync squash is content-identical to main and
          # must not trigger a promotion of its own, so a sync-only night
          # opens no PR. (Root commits have 0 parents and are likewise
          # excluded; release/develop will never see one.)
          n="$(gh api "repos/$REPO/compare/main...release/develop" --jq .ahead_by)"
          len="$(gh api "repos/$REPO/compare/main...release/develop" --jq '.commits | length')"
          # The compare API caps .commits at 250; refuse to decide on a
          # partial list (same fail-closed rule as validate() below).
          if [ "$n" != "$len" ]; then
            echo "::error::compare main...release/develop returned a partial list ($len of $n commits); refusing to decide on it"
            exit 1
          fi
          ahead="$(gh api "repos/$REPO/compare/main...release/develop" --jq '[.commits[] | select((.parents | length) == 1 and (.commit.message | startswith("Sync main into release/develop (nightly) (#") | not))] | length')"
          sync_only="$(gh api "repos/$REPO/compare/main...release/develop" --jq '[.commits[] | select((.parents | length) == 1 and (.commit.message | startswith("Sync main into release/develop (nightly) (#")))] | length')"
          if [ "$sync_only" != "0" ]; then
            echo "excluding $sync_only nightly-sync squash commit(s) from the promotion count (content already on main)"
          fi
          if [ "$ahead" = "0" ]; then
            echo "nothing to promote: release/develop has no single-parent non-sync commits that main lacks"
            exit 0
          fi
          # Do not title a PR "Sync main into release/develop (nightly)":
          # the promotion gate above excludes commits with that title
          # prefix from the promotion count by design.
          # H-52-1: nightly/promote must hold nothing except release/develop
          # commits and this job's own GitHub-signed merge commits. Fail
          # closed otherwise, both before reusing it and after building it.
          validate() {
            local n len
            n="$(gh api "repos/$REPO/compare/main...$BR" --jq .ahead_by)"
            len="$(gh api "repos/$REPO/compare/main...$BR" --jq '.commits | length')"
            if [ "$n" != "$len" ]; then
              echo "::error::$BR has $n commits not on main; refusing to check a partial list"
              return 1
            fi
            gh api "repos/$REPO/compare/main...$BR" \
              --jq '.commits[] | [.sha, (.parents | length), (.author.login // ""), .commit.verification.verified, (.commit.message | startswith("Merge "))] | @tsv' |
            while IFS=$'\t' read -r sha parents login verified merge_msg; do
              if [ "$parents" = "2" ] && [ "$login" = "github-actions[bot]" ] \
                 && [ "$verified" = "true" ] && [ "$merge_msg" = "true" ]; then
                continue
              fi
              st="$(gh api "repos/$REPO/compare/$sha...release/develop" --jq .status)"
              if [ "$st" != "ahead" ] && [ "$st" != "identical" ]; then
                echo "::error::$BR contains $sha, which is neither on release/develop nor a signed bot merge; refusing to promote"
                exit 1
              fi
            done || return 1
          }
          if gh api "repos/$REPO/git/ref/heads/$BR" >/dev/null 2>&1; then
            validate || exit 1
          else
            main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BR" -f sha="$main_sha" >/dev/null
          fi
          # Bring in any new main commits, then release/develop. Each call is
          # a normal (non-force) merge into nightly/promote, or a no-op. The
          # merges API refuses conflicts (409 fails the job); this job never
          # resolves conflicts, so its merge commits carry no authored content.
          gh api -X POST "repos/$REPO/merges" -f base="$BR" -f head=main \
            -f commit_message="$(printf 'Merge main into %s\n\n%s' "$BR" "$SOB")" >/dev/null
          gh api -X POST "repos/$REPO/merges" -f base="$BR" -f head=release/develop \
            -f commit_message="$(printf 'Merge release/develop into %s for nightly promotion\n\n%s' "$BR" "$SOB")" >/dev/null
          built="$(gh api "repos/$REPO/git/ref/heads/$BR" --jq .object.sha)"
          validate || exit 1
          day="$(date -u +%F)"
          pr="$(gh pr list --repo "$REPO" --head "$BR" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create --repo "$REPO" --base main --head "$BR" \
              --title "Nightly: promote release/develop to main" \
              --body "Automated nightly promotion (owner decision 2026-11-19). Full 3.11-3.15 CI on ubuntu, windows and macOS. Auto-merges with a merge commit once the required ci check is green.")"
            pr="${url##*/}"
          fi
          gh workflow run ci.yml --repo "$REPO" --ref "$BR"
          gh pr merge "$pr" --repo "$REPO" --merge --auto --match-head-commit "$built" \
            --subject "Nightly promotion of release/develop to main ($day) (#$pr)" \
            --body "$SOB"
          echo "promotion PR #$pr: full CI dispatched on $BR at $built, auto-merge pinned to $built"
