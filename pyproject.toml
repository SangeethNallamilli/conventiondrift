# T-001 package skeleton (ADR-0001, ADR-0002). Owner of this file: Release / DevOps.
[build-system]
# Build backend pinned exactly; the hashed build lock is requirements/build.txt
# and CI builds with `pip install --require-hashes -r requirements/build.txt`
# followed by `python -m build --no-isolation`.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "conventiondrift"
dynamic = ["version"]
description = "Checks whether a Python codebase still follows the rules written in its AGENTS.md / CLAUDE.md, and reports what a pull request changed."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "src/conventiondrift/_vendor/LICENSE"]
# No runtime dependencies (ADR-0002): stdlib plus vendored code under _vendor/ only.
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

[project.scripts]
conventiondrift = "conventiondrift.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["conventiondrift", "conventiondrift.*"]

[tool.setuptools.package-data]
"conventiondrift._vendor" = ["MANIFEST", "LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "conventiondrift.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import conventiondrift_testkit (under tests/, never shipped).
pythonpath = ["tests"]
# -m "not network" keeps CONTRIBUTING's plain `pytest` offline. Run
# `pytest -m network` in the T-003 network CI job (D-TL-14).
addopts = ["-p", "no:cacheprovider", "--strict-markers", "-m", "not network"]
markers = [
    "network: needs network access to a pinned download; deselected by default, run with `pytest -m network`",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Vendored files must stay byte-identical to the pinned sdist (ADR-0002).
extend-exclude = ["src/conventiondrift/_vendor/yaml/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# CI helpers shell out to git/uv/pip and fetch pinned artifacts.
"scripts/ci/**" = ["S603", "S607", "S310", "S202"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
# Vendored PyYAML is third-party source; do not type-check it under strict.
exclude = ["conventiondrift/_vendor/yaml/"]

[tool.coverage.run]
branch = true
parallel = true
source = ["conventiondrift"]
# Vendored third-party code is not measured against the merge-gate thresholds.
omit = ["*/conventiondrift/_vendor/*"]
relative_files = true

[tool.coverage.report]
omit = ["*/conventiondrift/_vendor/*"]


# T-003 mutation job. mutmut==3.8.1 is a new dependency and needs SR review.
# GATES.md thresholds are enforced by scripts/ci/check_mutation.py, not here.
[tool.mutmut]
source_paths = ["src/conventiondrift"]
do_not_mutate = ["src/conventiondrift/_vendor/*", "src/conventiondrift/__init__.py", "src/conventiondrift/__main__.py", "src/conventiondrift/cli.py"]
also_copy = ["scripts/ci", "tools", "README.md", "LICENSE"]
pytest_add_cli_args = ["-p", "mutation_yaml_guard"]
pytest_add_cli_args_test_selection = ["tests"]
