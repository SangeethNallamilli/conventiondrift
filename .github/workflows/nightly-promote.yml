# Nightly promotion of release/develop into main (owner decision
# 2026-11-19, amended 2026-11-26; merge policy reversed 2026-11-26).
# PRs land in release/develop as MERGE COMMITS (3.11 CI). Each night
# this job first syncs main into release/develop through a merge-commit
# PR (only when release/develop is strictly behind main), then opens or
# reuses a PR from nightly/promote into main and dispatches the full
# 3.11-3.15 CI on it. GitHub auto-merges it as a SQUASH — one squash
# commit per nightly promotion — only once the required `ci` check is
# green.
#
# Schedule: 09:00 UTC = 04:00 Eastern Standard Time (owner request
# 2026-11-26). GitHub cron is UTC-only, so during US daylight time
# (EDT, UTC-4) this runs at 05:00 EDT. Scheduled runs can start late
# under load.
#
# Why nightly/promote and not release/develop as the PR head: main
# requires branches to be up to date (strict `ci`), and the nightly sync
# merge into release/develop lands asynchronously (its own auto-merge
# waits for CI), so a same-night PR from release/develop could lack
# main's tip. The job builds the head branch as main plus a merge of
# release/develop via the merges API. Its merge commit carries a
# Signed-off-by line and is checked by the dco job like any other
# commit.
#
# Security: no checkout and no repository code runs here. It only makes
# GitHub API calls with the short-lived GITHUB_TOKEN, scoped to this job.
# No secrets, no PAT, no App, no branch-protection bypass. For the
# promotion, the merge goes through main's normal protection (required
# `ci`, up to date, conversation resolution) and lands as a squash. The
# sync opens a PR of main into release/develop and enables merge-commit
# auto-merge, so the branch's own gates (required `ci`, merge-commit
# ruleset) still apply; it introduces no authored content beyond main's
# commits. Schedule and manual runs on main only.
# nightly/promote is guarded by a ruleset (only the GitHub Actions app may
# create, update or delete it), and this job also re-checks its contents
# and pins auto-merge to the exact SHA it built (H-52-1).
name: nightly-promote

on:
  schedule:
    # 09:00 UTC = 04:00 EST (05:00 EDT during daylight saving).
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-promote
  cancel-in-progress: false

jobs:
  promote:
    name: promote
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create/update nightly/promote, and the sync branch + PR for the sync
      pull-requests: write   # open the PR and enable auto-merge
      actions: write         # dispatch ci.yml on nightly/promote
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BR: nightly/promote
      SOB: "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
    steps:
      - name: Sync release/develop with main (owner request 2026-11-26)
        # Merge policy 2026-11-26: release/develop takes merge commits
        # (linear history relaxed, ruleset 27675422 allows "merge"), so
        # the sync is a plain merge-commit PR of main into
        # release/develop. A merge keeps release/develop's newer
        # content, so the sync can never roll anything back — the guard
        # below only decides whether a sync is needed.
        #
        # The sync branch must contain release/develop's tip: rd's
        # classic protection has strict `ci` ("branches must be up to
        # date"), and a head branch at main's tip alone would not, so
        # the PR would block forever. Build the sync branch as rd's tip
        # plus a merges-API merge of main (bot merge commit with the
        # Signed-off-by line), so the head contains the base tip and the
        # PR's own pull_request CI (3.11) is the required `ci` check.
        # The bot merge carries the SOB, and the eventual PR merge
        # commit carries one too (auto-merge commit_message), so rd's
        # push-time dco range stays clean. A merge imports history:
        # behind_by reaches 0 for real once synced.
        run: |
          set -euo pipefail
          # Sync when main has commits that release/develop lacks.
          # behind_by > 0 while a merge is safe (merges never delete
          # rd's own newer content); "ahead" means nothing to sync, and
          # "diverged" means main has newer work — still a safe merge.
          behind="$(gh api "repos/$REPO/compare/main...release/develop" --jq .behind_by)"
          if [ "$behind" = "0" ]; then
            echo "release/develop has everything main has (compare behind_by: 0); nothing to sync"
            exit 0
          fi
          echo "main is $behind commits ahead of the merge base; building the sync branch"
          SB="sync/main-into-release-develop"
          rd_sha="$(gh api "repos/$REPO/git/ref/heads/release/develop" --jq .object.sha)"
          if gh api "repos/$REPO/git/ref/heads/$SB" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$SB" -f sha="$rd_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$SB" -f sha="$rd_sha" >/dev/null
          fi
          # Bot merge of main into the sync branch (contains rd's tip by
          # construction). Refuses conflicts (409) — fail closed; rd's
          # squashes and main's promoted content are the same changes, so
          # none is expected.
          gh api -X POST "repos/$REPO/merges" -f base="$SB" -f head=main \
            -f commit_message="$(printf 'Merge main into %s for the nightly sync\n\n%s' "$SB" "$SOB")" >/dev/null
          pr="$(gh pr list --repo "$REPO" --head "$SB" --base release/develop --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create --repo "$REPO" --base release/develop --head "$SB" \
              --title "Sync main into release/develop (nightly)" \
              --body "Automated nightly sync (owner request 2026-11-26): a merge of main into release/develop, so release/develop is current with main — history included. Auto-merges once release/develop's own gates are met — the required ci check and any review the branch's ruleset asks for.")"
            pr="${url##*/}"
          fi
          if gh api -X PUT "repos/$REPO/pulls/$pr/auto-merge" \
            -f merge_method=merge \
            -f commit_title="Merge main into release/develop (nightly sync) (#$pr)" \
            -f commit_message="$(printf 'Merge main into release/develop to keep it current (nightly sync)\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>')" \
            > /dev/null; then
            echo "sync PR #$pr: merge-commit auto-merge enabled"
          else
            echo "::warning::sync PR #$pr could not enable merge auto-merge; leaving it open for the next nightly run"
          fi

      - name: Open or reuse the promotion PR and start full CI
        run: |
          set -euo pipefail
          # Count only real (single-parent) commits that are not nightly
          # sync squashes. Sync MERGE commits (two parents) are excluded
          # by the parent-count filter itself; the prefix filter only
          # guards against sync squashes left over from the pre-reversal
          # flow. (Root commits have 0 parents and are likewise
          # excluded; release/develop will never see one.)
          n="$(gh api "repos/$REPO/compare/main...release/develop" --jq .ahead_by)"
          len="$(gh api "repos/$REPO/compare/main...release/develop" --jq '.commits | length')"
          # The compare API caps .commits at 250; refuse to decide on a
          # partial list (same fail-closed rule as validate() below).
          if [ "$n" != "$len" ]; then
            echo "::error::compare main...release/develop returned a partial list ($len of $n commits); refusing to decide on it"
            exit 1
          fi
          ahead="$(gh api "repos/$REPO/compare/main...release/develop" --jq '[.commits[] | select((.parents | length) == 1 and (.commit.message | startswith("Sync main into release/develop (nightly) (#") | not))] | length')"
          sync_only="$(gh api "repos/$REPO/compare/main...release/develop" --jq '[.commits[] | select((.parents | length) == 1 and (.commit.message | startswith("Sync main into release/develop (nightly) (#")))] | length')"
          if [ "$sync_only" != "0" ]; then
            echo "excluding $sync_only nightly-sync squash commit(s) from the promotion count (content already on main)"
          fi
          if [ "$ahead" = "0" ]; then
            echo "nothing to promote: release/develop has no single-parent non-sync commits that main lacks"
            exit 0
          fi
          # Do not title a PR "Sync main into release/develop (nightly)":
          # the promotion gate above excludes commits with that title
          # prefix from the promotion count by design.
          # H-52-1: nightly/promote must hold nothing except release/develop
          # commits and this job's own GitHub-signed merge commits. Fail
          # closed otherwise, both before reusing it and after building it.
          validate() {
            local n len
            n="$(gh api "repos/$REPO/compare/main...$BR" --jq .ahead_by)"
            len="$(gh api "repos/$REPO/compare/main...$BR" --jq '.commits | length')"
            if [ "$n" != "$len" ]; then
              echo "::error::$BR has $n commits not on main; refusing to check a partial list"
              return 1
            fi
            gh api "repos/$REPO/compare/main...$BR" \
              --jq '.commits[] | [.sha, (.parents | length), (.author.login // ""), .commit.verification.verified, (.commit.message | startswith("Merge "))] | @tsv' |
            while IFS=$'\t' read -r sha parents login verified merge_msg; do
              if [ "$parents" = "2" ] && [ "$login" = "github-actions[bot]" ] \
                 && [ "$verified" = "true" ] && [ "$merge_msg" = "true" ]; then
                continue
              fi
              st="$(gh api "repos/$REPO/compare/$sha...release/develop" --jq .status)"
              if [ "$st" != "ahead" ] && [ "$st" != "identical" ]; then
                echo "::error::$BR contains $sha, which is neither on release/develop nor a signed bot merge; refusing to promote"
                exit 1
              fi
            done || return 1
          }
          if gh api "repos/$REPO/git/ref/heads/$BR" >/dev/null 2>&1; then
            validate || exit 1
          else
            main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BR" -f sha="$main_sha" >/dev/null
          fi
          # Bring in any new main commits, then release/develop. Each call is
          # a normal (non-force) merge into nightly/promote, or a no-op. The
          # merges API refuses conflicts (409 fails the job); this job never
          # resolves conflicts, so its merge commits carry no authored content.
          gh api -X POST "repos/$REPO/merges" -f base="$BR" -f head=main \
            -f commit_message="$(printf 'Merge main into %s\n\n%s' "$BR" "$SOB")" >/dev/null
          gh api -X POST "repos/$REPO/merges" -f base="$BR" -f head=release/develop \
            -f commit_message="$(printf 'Merge release/develop into %s for nightly promotion\n\n%s' "$BR" "$SOB")" >/dev/null
          built="$(gh api "repos/$REPO/git/ref/heads/$BR" --jq .object.sha)"
          validate || exit 1
          day="$(date -u +%F)"
          pr="$(gh pr list --repo "$REPO" --head "$BR" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create --repo "$REPO" --base main --head "$BR" \
              --title "Nightly: promote release/develop to main" \
              --body "Automated nightly promotion (owner decision 2026-11-19, merge policy 2026-11-26: one squash commit per promotion). Full 3.11-3.15 CI on ubuntu, windows and macOS. Auto-merges as a squash once the required ci check is green.")"
            pr="${url##*/}"
          fi
          # The promotion lands as a SQUASH (policy 2026-11-26: one
          # squash commit per nightly promotion; main-squash-only ruleset
          # 28142725 requires it). The squash commit message carries the
          # bot Signed-off-by, which is the only commit in main's
          # push-time dco range.
          gh workflow run ci.yml --repo "$REPO" --ref "$BR"
          gh pr merge "$pr" --repo "$REPO" --squash --auto --match-head-commit "$built" \
            --subject "Nightly promotion of release/develop to main ($day) (#$pr)" \
            --body "$SOB"
          echo "promotion PR #$pr: full CI dispatched on $BR at $built, squash auto-merge pinned to $built"
