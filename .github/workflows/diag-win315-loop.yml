# D-TL-104 / D-TL-105 one-off diagnostic (diag branch only; never merged, never a PR).
# D-TL-105: loops the WHOLE tests/unit/test_gitread_pipe_holders.py on
# windows-latest / Python 3.15, under coverage exactly like ci.yml's Windows
# `test` job coverage step, in two isolated jobs (separate runners):
#   phase A: 10 iterations, no extra load
#   phase B: 10 iterations with one busy-loop process per logical CPU
# Captures failures, any test over PROMPT (4.5 s) and the D-TL-103 (#91)
# thread-stack dumps into the log, the step summary and an artifact.
# No secrets, contents: read, persist-credentials: false, every uses: pinned to
# the same full SHAs as ci.yml / bench.yml. Runs on push to this diag branch
# only (workflow_dispatch needs the file on the default branch).
name: diag-win315-loop

on:
  push:
    branches: [diag/d-tl-104-win315-loop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HYPOTHESIS_SEED: "20261112"
  UV_VERSION: "0.13.7"
  TARGET: tests/unit/test_gitread_pipe_holders.py
  ITERATIONS: "10"
  BUDGET_SECONDS: "2400"

jobs:
  win315-file-loop:
    name: diag win315 pipe-holders file loop (phase ${{ matrix.phase }})
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: A
            load: false
          - phase: B
            load: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          checksum: ${{ fromJSON('{"Linux-X64":"c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83","Windows-X64":"0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021","macOS-ARM64":"81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731","macOS-X64":"20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7"}')[format('{0}-{1}', runner.os, runner.arch)] || 'MISSING_UV_CHECKSUM' }}
          enable-cache: false
      - name: Report the default runner git version
        run: git --version
      - name: CONTRIBUTING setup (Windows) — same as ci.yml test job
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-pkg-cache
        run: |
          python -m venv .venv
          uv pip install --python .venv/Scripts/python.exe --require-hashes --no-deps --only-binary=:all: -r requirements/build.txt -r requirements/dev.txt
          uv pip install --python .venv/Scripts/python.exe --no-deps --no-build-isolation -e .
          echo "$(cygpath -w "${PWD}/.venv/Scripts")" >> "$GITHUB_PATH"
          .venv/Scripts/conventiondrift --version
      - name: Confirm no PyPI PyYAML in this environment
        run: python scripts/ci/check_no_pypi_yaml.py
      - name: Start CPU load (phase B only; one busy loop per logical CPU)
        if: matrix.load
        shell: pwsh
        env:
          # setup-python's real interpreter, not the .venv launcher stub (which
          # re-spawns the interpreter as a child and shows 0 CPU itself).
          BASE_PY: ${{ steps.py.outputs.python-path }}
        run: |
          $n = [Environment]::ProcessorCount
          $pids = @()
          for ($i = 0; $i -lt $n; $i++) {
            $p = Start-Process -FilePath $env:BASE_PY -ArgumentList '-c', '"while True: pass"' -WindowStyle Hidden -PassThru
            $pids += $p.Id
          }
          $pids -join "`n" | Set-Content -Path "$env:RUNNER_TEMP\load-pids.txt"
          Start-Sleep -Seconds 5
          Write-Host "logical CPUs: $n; started busy loops: $($pids -join ', ') ($env:BASE_PY)"
          $procs = Get-Process -Id $pids
          $procs | Format-Table Id, CPU, StartTime -AutoSize
          $idle = @($procs | Where-Object { $_.CPU -lt 2 })
          if ($idle.Count -gt 0) { Write-Error "busy loops are not burning CPU: $($idle.Id -join ', ')"; exit 1 }
          $load = (Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average
          Write-Host "CPU load after start: $load %"
      - name: Loop the whole file under coverage (as the ci.yml coverage step)
        run: |
          set +e
          out="${RUNNER_TEMP}/diag"
          mkdir -p "$out"
          python -c "import pathlib, sysconfig; pathlib.Path(sysconfig.get_path('purelib')).joinpath('coverage_startup.pth').write_text('import coverage; coverage.process_startup()\\n')"
          export COVERAGE_PROCESS_START="${PWD}/pyproject.toml"
          start=$(date +%s)
          i=0
          while [ "$i" -lt "$ITERATIONS" ] && [ $(( $(date +%s) - start )) -lt "$BUDGET_SECONDS" ]; do
            i=$((i + 1))
            n=$(printf '%03d' "$i")
            echo "::group::phase ${{ matrix.phase }} iteration $n (elapsed $(( $(date +%s) - start )) s)"
            python -m coverage run --parallel-mode -m pytest "$TARGET" \
              -m "not network and not timing" -rs -vv --tb=long --durations=10 \
              --hypothesis-seed="${HYPOTHESIS_SEED}" \
              -o junit_duration_report=call --junitxml="$out/junit-$n.xml" > "$out/pytest-$n.log" 2>&1
            rc=$?
            echo "iteration $n exit $rc" | tee -a "$out/exit-codes.txt"
            if [ "${{ matrix.load }}" = "true" ]; then
              echo "iteration $n cpu-load $(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average") %" | tee -a "$out/cpu-load.txt"
            fi
            tail -n 25 "$out/pytest-$n.log"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "=== FULL OUTPUT OF FAILING ITERATION $n ==="
              cat "$out/pytest-$n.log"
            fi
            rm -f .coverage .coverage.*
          done
          echo "phase ${{ matrix.phase }}: ran $i iterations in $(( $(date +%s) - start )) s"
          exit 0
      - name: Confirm CPU load was still running (phase B only)
        if: always() && matrix.load
        shell: pwsh
        run: |
          $pids = Get-Content "$env:RUNNER_TEMP\load-pids.txt"
          Get-Process -Id $pids -ErrorAction SilentlyContinue | Format-Table Id, CPU, StartTime -AutoSize
          $load = (Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average
          Write-Host "CPU load at end of phase B: $load %"
      - name: Stop CPU load (phase B only)
        if: always() && matrix.load
        shell: pwsh
        run: |
          $f = "$env:RUNNER_TEMP\load-pids.txt"
          if (Test-Path $f) {
            foreach ($id in Get-Content $f) { Stop-Process -Id ([int]$id) -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "busy loops stopped"
      - name: Summarize failures, tests over 4.5 s, slowest tests and stack dumps
        if: always()
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          python - <<'PY'
          import glob, os, re, xml.etree.ElementTree as ET
          out = os.path.join(os.environ["RUNNER_TEMP"], "diag")
          phase = os.environ["PHASE"]
          PROMPT = 4.5
          stats, fails, over = {}, [], []
          files = sorted(glob.glob(os.path.join(out, "junit-*.xml")))
          for f in files:
              it = re.search(r"junit-(\d+)\.xml", f).group(1)
              for tc in ET.parse(f).iter("testcase"):
                  name = tc.get("name")
                  t = float(tc.get("time") or 0)
                  s = stats.setdefault(name, {"n": 0, "times": [], "fail": 0, "skip": 0})
                  s["n"] += 1
                  s["times"].append(t)
                  if tc.find("skipped") is not None:
                      s["skip"] += 1
                  if t > PROMPT:
                      over.append((it, name, t))
                  bad = tc.find("failure") if tc.find("failure") is not None else tc.find("error")
                  if bad is not None:
                      s["fail"] += 1
                      text = (bad.get("message") or "") + "\n" + (bad.text or "")
                      m = re.search(r"the kill took ([0-9.]+) s", text)
                      path = os.path.join(out, f"failure-{it}-{re.sub(r'[^A-Za-z0-9]+', '_', name)[:120]}.txt")
                      with open(path, "w", encoding="utf-8") as fh:
                          fh.write(text)
                      fails.append((it, name, m.group(1) if m else "n/a", path))
          L = [f"# D-TL-105 phase {phase}: {len(files)} iterations of the whole pipe-holders file", "",
               f"Failures: {len(fails)}; test calls over {PROMPT} s: {len(over)}", "",
               "| test | runs | skips | min s | median s | max s | failures |", "|---|---|---|---|---|---|---|"]
          for name in sorted(stats, key=lambda k: -max(stats[k]["times"])):
              s = stats[name]; ts = sorted(s["times"])
              L.append(f"| {name} | {s['n']} | {s['skip']} | {ts[0]:.2f} | {ts[len(ts)//2]:.2f} | {ts[-1]:.2f} | {s['fail']} |")
          if over:
              L += ["", f"## Test calls over {PROMPT} s"] + [f"- iteration {it}: {n} {t:.2f} s" for it, n, t in over]
          if fails:
              L += ["", "## Failures"] + [f"- iteration {it}: {n} (kill took {k} s) -> {os.path.basename(p)}" for it, n, k, p in fails]
          text = "\n".join(L) + "\n"
          print(text)
          open(os.path.join(out, "summary.md"), "w", encoding="utf-8").write(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text)
              for it, n, k, p in fails:
                  fh.write(f"\n<details><summary>iteration {it}: {n} (took {k} s)</summary>\n\n```\n{open(p, encoding='utf-8').read()[:60000]}\n```\n</details>\n")
          for it, n, k, p in fails:
              print(f"\n===== FAILURE / STACK DUMP: phase {phase} iteration {it} {n} (took {k} s) =====")
              print(open(p, encoding="utf-8").read())
          PY
      - name: Upload loop logs, JUnit and stack dumps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d-tl-105-win315-phase-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diag
          retention-days: 14
          if-no-files-found: warn
