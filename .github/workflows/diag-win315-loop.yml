# D-TL-104 / D-TL-105 / D-TL-106 one-off diagnostic (diag branch only; never
# merged, never a PR, non-blocking).
# D-TL-106: on windows-latest / Python 3.15, repeat ci.yml's Windows `test` job
# "pytest with coverage" step (the FULL offline suite, same command, markers,
# coverage options and env) so tests/unit/test_gitread_pipe_holders.py runs
# in-process after the earlier tests, as in run 45564181345. Like that job, the
# timing-marked step runs once first (non-blocking here). 3 parallel shards
# (separate runners) x up to 5 iterations, no added CPU load. Captures failures,
# every test call over PROMPT (4.5 s), per-iteration durations and any D-TL-103
# (#91) thread-stack dump into the log, the step summary and an artifact.
# No secrets, contents: read, persist-credentials: false, every uses: pinned to
# the same full SHAs as ci.yml / bench.yml. Runs on push to this diag branch
# only (workflow_dispatch needs the file on the default branch).
name: diag-win315-loop

on:
  push:
    branches: [diag/d-tl-104-win315-loop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HYPOTHESIS_SEED: "20261112"
  UV_VERSION: "0.13.7"
  ITERATIONS: "5"
  # Start no new iteration after 100 min (a full coverage step is ~10-13 min).
  BUDGET_SECONDS: "6000"

jobs:
  win315-full-coverage-loop:
    name: diag win315 full coverage step loop (shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          checksum: ${{ fromJSON('{"Linux-X64":"c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83","Windows-X64":"0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021","macOS-ARM64":"81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731","macOS-X64":"20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7"}')[format('{0}-{1}', runner.os, runner.arch)] || 'MISSING_UV_CHECKSUM' }}
          enable-cache: false
      - name: Report the default runner git version
        run: git --version
      - name: CONTRIBUTING setup (Windows) — same as ci.yml test job
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-pkg-cache
        run: |
          python -m venv .venv
          uv pip install --python .venv/Scripts/python.exe --require-hashes --no-deps --only-binary=:all: -r requirements/build.txt -r requirements/dev.txt
          uv pip install --python .venv/Scripts/python.exe --no-deps --no-build-isolation -e .
          echo "$(cygpath -w "${PWD}/.venv/Scripts")" >> "$GITHUB_PATH"
          .venv/Scripts/conventiondrift --version
      - name: Confirm no PyPI PyYAML in this environment
        run: python scripts/ci/check_no_pypi_yaml.py
      - name: pytest timing-marked tests without coverage (as ci.yml; once, non-blocking)
        continue-on-error: true
        run: |
          unset COVERAGE_PROCESS_START
          python -m pytest tests -m "timing and not network" -rs --hypothesis-seed="${HYPOTHESIS_SEED}"
      - name: Loop the full ci.yml coverage step
        run: |
          set +e
          out="${RUNNER_TEMP}/diag"
          mkdir -p "$out"
          python -c "import pathlib, sysconfig; pathlib.Path(sysconfig.get_path('purelib')).joinpath('coverage_startup.pth').write_text('import coverage; coverage.process_startup()\\n')"
          export COVERAGE_PROCESS_START="${PWD}/pyproject.toml"
          start=$(date +%s)
          i=0
          while [ "$i" -lt "$ITERATIONS" ] && [ $(( $(date +%s) - start )) -lt "$BUDGET_SECONDS" ]; do
            i=$((i + 1))
            n=$(printf '%03d' "$i")
            echo "::group::shard ${{ matrix.shard }} iteration $n (elapsed $(( $(date +%s) - start )) s)"
            t0=$(date +%s)
            # Same command as ci.yml's coverage step; only --junitxml and its
            # duration mode are added (reporting only).
            python -m coverage run --parallel-mode -m pytest tests -m "not network and not timing" -rs \
              --hypothesis-seed="${HYPOTHESIS_SEED}" \
              -o junit_duration_report=call --junitxml="$out/junit-$n.xml" > "$out/pytest-$n.log" 2>&1
            rc=$?
            t1=$(date +%s)
            python -m coverage combine > "$out/coverage-$n.log" 2>&1
            python -m coverage json -o "$out/coverage-$n.json" >> "$out/coverage-$n.log" 2>&1
            python -m coverage report --show-missing >> "$out/coverage-$n.log" 2>&1
            echo "iteration $n exit $rc pytest-seconds $((t1 - t0))" | tee -a "$out/iterations.txt"
            tail -n 30 "$out/pytest-$n.log"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "=== FAILURES IN ITERATION $n ==="
              sed -n '/= FAILURES =/,/short test summary/p' "$out/pytest-$n.log"
            fi
            rm -f .coverage .coverage.*
          done
          echo "shard ${{ matrix.shard }}: ran $i iterations in $(( $(date +%s) - start )) s"
          exit 0
      - name: Summarize failures, tests over 4.5 s, pipe-holder timings and stack dumps
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import glob, os, re, xml.etree.ElementTree as ET
          out = os.path.join(os.environ["RUNNER_TEMP"], "diag")
          shard = os.environ["SHARD"]
          PROMPT = 4.5
          PIPE = "test_gitread_pipe_holders"
          iters = {}
          if os.path.exists(os.path.join(out, "iterations.txt")):
              for line in open(os.path.join(out, "iterations.txt"), encoding="utf-8"):
                  p = line.split()
                  iters[p[1]] = (p[3], p[5])
          pipe, fails, over, per_it = {}, [], [], {}
          for f in sorted(glob.glob(os.path.join(out, "junit-*.xml"))):
              it = re.search(r"junit-(\d+)\.xml", f).group(1)
              cnt = {"tests": 0, "fail": 0, "skip": 0, "over": 0, "pipe_over": 0}
              for tc in ET.parse(f).iter("testcase"):
                  cls, name = tc.get("classname") or "", tc.get("name")
                  full = f"{cls}::{name}"
                  t = float(tc.get("time") or 0)
                  cnt["tests"] += 1
                  if tc.find("skipped") is not None:
                      cnt["skip"] += 1
                  if PIPE in cls:
                      pipe.setdefault(name, []).append(t)
                  if t > PROMPT:
                      cnt["over"] += 1
                      cnt["pipe_over"] += PIPE in cls
                      over.append((it, full, t))
                  bad = tc.find("failure") if tc.find("failure") is not None else tc.find("error")
                  if bad is not None:
                      cnt["fail"] += 1
                      text = (bad.get("message") or "") + "\n" + (bad.text or "")
                      m = re.search(r"the kill took ([0-9.]+) s", text)
                      path = os.path.join(out, f"failure-{it}-{re.sub(r'[^A-Za-z0-9]+', '_', full)[-140:]}.txt")
                      with open(path, "w", encoding="utf-8") as fh:
                          fh.write(text)
                      fails.append((it, full, m.group(1) if m else "n/a", path))
              per_it[it] = cnt
          L = [f"# D-TL-106 shard {shard}: {len(per_it)} iterations of the full Windows 3.15 coverage step", "",
               "| iteration | pytest exit | pytest s | tests | skipped | failures | calls > 4.5 s | pipe-holder calls > 4.5 s |",
               "|---|---|---|---|---|---|---|---|"]
          for it in sorted(per_it):
              c = per_it[it]; rc, secs = iters.get(it, ("?", "?"))
              L.append(f"| {it} | {rc} | {secs} | {c['tests']} | {c['skip']} | {c['fail']} | {c['over']} | {c['pipe_over']} |")
          L += ["", "## Pipe-holder tests (call s), slowest first", "", "| test | runs | min | median | max |", "|---|---|---|---|---|"]
          for name in sorted(pipe, key=lambda k: -max(pipe[k])):
              ts = sorted(pipe[name])
              L.append(f"| {name} | {len(ts)} | {ts[0]:.2f} | {ts[len(ts)//2]:.2f} | {ts[-1]:.2f} |")
          L += ["", f"## Test calls over {PROMPT} s ({len(over)})"] + [f"- iteration {it}: {n} {t:.2f} s" for it, n, t in sorted(over, key=lambda x: -x[2])]
          L += ["", f"## Failures ({len(fails)})"] + [f"- iteration {it}: {n} (kill took {k} s) -> {os.path.basename(p)}" for it, n, k, p in fails]
          text = "\n".join(L) + "\n"
          print(text)
          open(os.path.join(out, "summary.md"), "w", encoding="utf-8").write(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text)
              for it, n, k, p in fails:
                  fh.write(f"\n<details><summary>iteration {it}: {n} (took {k} s)</summary>\n\n```\n{open(p, encoding='utf-8').read()[:60000]}\n```\n</details>\n")
          for it, n, k, p in fails:
              print(f"\n===== FAILURE / STACK DUMP: shard {shard} iteration {it} {n} (took {k} s) =====")
              print(open(p, encoding="utf-8").read())
          PY
      - name: Upload loop logs, JUnit, coverage reports and stack dumps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d-tl-106-win315-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diag
          retention-days: 14
          if-no-files-found: warn
