# T-003 CI. Every third-party uses: is pinned to a full 40-character SHA
# with a version comment (R7.3, AC-N3.11). This workflow never uses
# pull_request_target or workflow_run (R5.2, AC-N3.5).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HYPOTHESIS_SEED: "20261112"

jobs:
  pin-lint:
    name: pin-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Lint action pins and forbidden triggers
        run: python3 scripts/ci/check_action_pins.py

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Check Signed-off-by on each PR commit
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/check_dco.py

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Recompile lockfiles and require a match
        run: python3 scripts/ci/check_lockfiles.py

  lint:
    name: lint
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned pip, then hashed locks
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps -r requirements/build.txt -r requirements/dev.txt
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check src
        # ruff excludes src/conventiondrift/_vendor/, so S506 (unsafe YAML loaders)
        # covers only our own code, not the vendored tree.

  types:
    name: types
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned pip, then hashed locks
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps -r requirements/build.txt -r requirements/dev.txt
      - name: mypy --strict src
        run: mypy --strict src

  test:
    name: test
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Report the default runner git version
        run: git --version
      - name: Install hash-pinned pip, then hashed locks
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps -r requirements/build.txt -r requirements/dev.txt
      - name: Install the package (no deps, no build isolation)
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: pytest with coverage (unit/spec/snapshot/property, fixed seed)
        run: |
          site="$(python -c 'import site; print(site.getsitepackages()[0])')"
          printf 'import coverage; coverage.process_startup()\n' > "${site}/coverage_startup.pth"
          export COVERAGE_PROCESS_START="${PWD}/pyproject.toml"
          coverage run --parallel-mode -m pytest tests/unit tests/spec tests/snapshot tests/property --hypothesis-seed="${HYPOTHESIS_SEED}"
          coverage combine
          coverage json -o coverage.json
          coverage report --show-missing
      - name: Coverage gate (90/85 overall; 95 branch on critical modules when present)
        run: python3 scripts/ci/check_coverage.py coverage.json

  build:
    name: build
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned pip, then the build lock
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps -r requirements/build.txt
      - name: python -m build --no-isolation
        run: python -m build --no-isolation

  release:
    name: release
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned pip, then hashed locks
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps -r requirements/build.txt -r requirements/dev.txt
      - name: Install the package (no deps, no build isolation)
        run: python -m pip install --no-deps --no-build-isolation -e .
      # test_vendor_manifest downloads the pinned sdist; this job has network (not offline).
      - name: Release checks (TE tests if present, otherwise scripts/ci)
        run: |
          if [ -f tests/release/test_vendor_manifest.py ]; then
            echo "Using tests/release from the tree (PR #12)"
            python -m pytest tests/release --hypothesis-seed="${HYPOTHESIS_SEED}"
          else
            echo "tests/release not on this tree yet; using scripts/ci fallback"
            python3 scripts/ci/check_vendor.py
            python3 -I scripts/ci/check_import_resolution.py
          fi

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run checksum-pinned gitleaks
        run: python3 scripts/ci/run_gitleaks.py

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: OSV scan of lockfiles and vendored PyYAML 6.0.3
        run: python3 scripts/ci/check_dependency_vulns.py

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Report the default runner git version
        shell: pwsh
        run: git --version
      - name: CONTRIBUTING setup steps in PowerShell (not yet documented; allowed to fail)
        shell: pwsh
        run: |
          # Translation of the CONTRIBUTING.md Unix setup. Windows steps are
          # not in CONTRIBUTING yet (TW-OPEN); this job exists so they can be
          # documented from a real runner. python3 is typically `python` here.
          python -m venv .venv
          .\.venv\Scripts\pip install --require-hashes --no-deps -r requirements/build.txt -r requirements/dev.txt
          .\.venv\Scripts\pip install --no-deps --no-build-isolation -e .
          .\.venv\Scripts\conventiondrift --version

  git-2-24:
    name: git-2-24
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Digest of python:3.11-bookworm (tag updated 2026-11-06). Running in a
    # pinned container keeps the compiler toolchain stable so Git 2.24.4
    # (2019) still builds; ubuntu-latest is already on much newer gcc.
    container:
      image: python:3.11-bookworm@sha256:726d304906fa5eb468e5531e366548d1903286352f5adb54ef508ac01fbd80c6 # 3.11-bookworm 2026-11-06
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Git build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates gettext libcurl4-openssl-dev \
            libexpat1-dev libssl-dev make zlib1g-dev
      - name: Build checksum-pinned Git 2.24.4
        run: python3 scripts/ci/install_git_min.py
      - name: Confirm PATH git is 2.24.4
        run: |
          command -v git
          git --version
          case "$(git --version)" in
            "git version 2.24.4") ;;
            *) echo "expected git version 2.24.4" >&2; exit 1 ;;
          esac
      - name: Install hash-pinned pip, then hashed locks
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps -r requirements/build.txt -r requirements/dev.txt
      - name: Install the package (no deps, no build isolation)
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: pytest against Git 2.24.4 (unit/spec/snapshot/property)
        run: python -m pytest tests/unit tests/spec tests/snapshot tests/property --hypothesis-seed="${HYPOTHESIS_SEED}"

  ci:
    name: ci
    if: always()
    needs:
      - pin-lint
      - dco
      - lockfile
      - lint
      - types
      - test
      - build
      - release
      - git-2-24
      - secret-scan
      - dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: All required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = []
          for name, data in needs.items():
              result = data.get("result")
              # dco is skipped on push to main; every other required job must succeed.
              if result == "success":
                  continue
              if name == "dco" and result == "skipped":
                  continue
              failed.append(f"{name}={result}")
          if failed:
              print("required jobs not green:", ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          print("ok: required CI jobs passed")
          PY
