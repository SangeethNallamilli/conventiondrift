# T-003 CI. Every third-party uses: is pinned to a full 40-character SHA
# with a version comment (R7.3, AC-N3.11). This workflow never uses
# pull_request_target or workflow_run (R5.2, AC-N3.5).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
    # Weekly mutation run (owner decision 2026-11-13): Mondays 07:41 UTC.
    # Only the mutation job keys on this cron; see its `if:`.
    - cron: '41 7 * * 1'
  workflow_dispatch:

concurrency:
  # Schedule runs get their own group so a nightly does not share a slot
  # with a push to main. cancel-in-progress is only true for pull_request,
  # so in-progress main, nightly, and workflow_dispatch runs are never
  # cancelled by a later run in the same group.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HYPOTHESIS_SEED: "20261112"
  UV_VERSION: "0.13.7"

jobs:
  pin-lint:
    name: pin-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Lint action pins and forbidden triggers
        run: python3 scripts/ci/check_action_pins.py

  dco:
    # Runs on pull_request, and on workflow_dispatch when the ref is not
    # main, so a manual run on a PR branch cannot produce a green `ci`
    # while skipping the DCO gate. Push, schedule, and workflow_dispatch
    # on main still skip this job; the aggregate allows that skip only
    # on refs/heads/main for those events.
    name: dco
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Resolve the DCO range
        # For pull_request, use the PR base/head SHAs. For workflow_dispatch
        # on a non-main branch, fetch origin/main anonymously (the repo is
        # public) and check merge-base(origin/main, HEAD)..HEAD via the
        # existing DCO_BASE_SHA / DCO_HEAD_SHA interface. github.* values
        # are passed in as env; they are never interpolated into the
        # script body. persist-credentials stays false and this fetch is
        # unauthenticated, so no token is written to .git/config.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "DCO_BASE_SHA=${PR_BASE_SHA}" >> "$GITHUB_ENV"
            printf '%s\n' "DCO_HEAD_SHA=${PR_HEAD_SHA}" >> "$GITHUB_ENV"
          else
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            base="$(git merge-base origin/main HEAD)"
            head="$(git rev-parse HEAD)"
            printf '%s\n' "DCO_BASE_SHA=${base}" >> "$GITHUB_ENV"
            printf '%s\n' "DCO_HEAD_SHA=${head}" >> "$GITHUB_ENV"
          fi
      - name: Check Signed-off-by on each commit in the range
        env:
          DCO_BASE_SHA: ${{ env.DCO_BASE_SHA }}
          DCO_HEAD_SHA: ${{ env.DCO_HEAD_SHA }}
        run: python3 scripts/ci/check_dco.py

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          # Official sha256 from https://github.com/astral-sh/uv/releases/download/0.13.7/sha256.sum
          # for the archive this runner downloads. A missing OS/arch key yields
          # a sentinel that fails verification rather than skipping the check.
          checksum: ${{ fromJSON('{"Linux-X64":"c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83","Windows-X64":"0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021","macOS-ARM64":"81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731","macOS-X64":"20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7"}')[format('{0}-{1}', runner.os, runner.arch)] || 'MISSING_UV_CHECKSUM' }}
          enable-cache: false
      - name: Recompile lockfiles and require a match
        run: python3 scripts/ci/check_lockfiles.py

  lint:
    name: lint
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned pip, then hashed locks
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements/build.txt -r requirements/dev.txt
      - name: Confirm no PyPI PyYAML in this environment
        run: python3 scripts/ci/check_no_pypi_yaml.py
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check src
        # ruff excludes src/conventiondrift/_vendor/, so S506 (unsafe YAML loaders)
        # covers only our own code, not the vendored tree.

  types:
    name: types
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned pip, then hashed locks
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements/build.txt -r requirements/dev.txt
      - name: mypy --strict src and tests/unit (D-TL-21)
        env:
          MYPYPATH: src
        run: mypy --strict src tests/unit


  test:
    # SPEC §6.1 / AC-N5.2: every CLI test must pass on every OS × Python
    # combination. Platform skips belong in individual tests, not jobs.
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [lockfile]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macOS legs run in the blocking `test-macos` job below (D-TL-34).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # On pull_request, Windows runs only 3.11 and 3.15 so the PR queue
        # stays shorter. Ubuntu keeps the full 3.11–3.15 set. The full
        # OS × Python matrix still runs on push to main, on the nightly
        # schedule, and on workflow_dispatch, before any release. Excluded
        # legs are omitted (they never start), so the `test` job result is
        # the remaining legs and the required `ci` aggregate is unchanged.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"windows-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.14"}]' || '[]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          # Official sha256 from https://github.com/astral-sh/uv/releases/download/0.13.7/sha256.sum
          # for the archive this runner downloads. A missing OS/arch key yields
          # a sentinel that fails verification rather than skipping the check.
          checksum: ${{ fromJSON('{"Linux-X64":"c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83","Windows-X64":"0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021","macOS-ARM64":"81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731","macOS-X64":"20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7"}')[format('{0}-{1}', runner.os, runner.arch)] || 'MISSING_UV_CHECKSUM' }}
          enable-cache: false
      # Test/test-macos only (contents: read, no secrets or id-token).
      # Restore on pull_request; restore and save on push, schedule, and
      # workflow_dispatch. Key is runner.os, runner.arch, UV_VERSION, the
      # Python version, and hashFiles of the committed lockfiles. uv does
      # not re-hash wheels from its cache; cache integrity relies on
      # GitHub cache scoping (PR runs restore only; only
      # main/schedule/dispatch runs save). Installs still use
      # --require-hashes and --only-binary=:all:. UV_CACHE_DIR is set on
      # the install steps (runner.* is not available in job env).
      - name: Restore the uv package cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/uv-pkg-cache
          key: uv-test-${{ runner.os }}-${{ runner.arch }}-uv${{ env.UV_VERSION }}-${{ matrix.python-version }}-${{ hashFiles('requirements/build.txt', 'requirements/dev.txt') }}
      - name: Restore and save the uv package cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/uv-pkg-cache
          key: uv-test-${{ runner.os }}-${{ runner.arch }}-uv${{ env.UV_VERSION }}-${{ matrix.python-version }}-${{ hashFiles('requirements/build.txt', 'requirements/dev.txt') }}
      - name: Report the default runner git version
        run: git --version
      - name: CONTRIBUTING setup (Windows)
        if: runner.os == 'Windows'
        # Job default is bash -e -o pipefail, so a failed native command
        # stops the step (L-5). Do not use pwsh here.
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-pkg-cache
        run: |
          # Translation of the CONTRIBUTING.md Unix setup (TW-OPEN). This is
          # the Windows install path for this matrix leg. The job fails if
          # install or later tests fail (AC-N5.2); no continue-on-error.
          # Keep the .venv layout and PATH so later steps still use
          # .venv/Scripts/python and .venv/Scripts/conventiondrift.
          # uv on Windows needs the python.exe path, not the extensionless shim.
          python -m venv .venv
          uv pip install --python .venv/Scripts/python.exe --require-hashes --no-deps --only-binary=:all: -r requirements/build.txt -r requirements/dev.txt
          uv pip install --python .venv/Scripts/python.exe --no-deps --no-build-isolation -e .
          echo "$(cygpath -w "${PWD}/.venv/Scripts")" >> "$GITHUB_PATH"
          .venv/Scripts/conventiondrift --version
      - name: Install hashed locks with uv
        if: runner.os != 'Windows'
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-pkg-cache
        run: |
          uv pip install --python "$(command -v python)" --require-hashes --no-deps --only-binary=:all: -r requirements/build.txt -r requirements/dev.txt
      - name: Install the package (no deps, no build isolation)
        if: runner.os != 'Windows'
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-pkg-cache
        run: |
          uv pip install --python "$(command -v python)" --no-deps --no-build-isolation -e .
      - name: Confirm no PyPI PyYAML in this environment
        run: python scripts/ci/check_no_pypi_yaml.py
      - name: pytest with coverage (offline paths, fixed seed)
        run: |
          # Write the startup .pth into purelib (site-packages). On Windows,
          # site.getsitepackages()[0] is the venv root, which site processes
          # before site-packages is on sys.path, so `import coverage` failed
          # there and leaked a traceback into child-process stderr.
          python -c "import pathlib, sysconfig; pathlib.Path(sysconfig.get_path('purelib')).joinpath('coverage_startup.pth').write_text('import coverage; coverage.process_startup()\\n')"
          export COVERAGE_PROCESS_START="${PWD}/pyproject.toml"
          # Full offline suite: unit/spec/snapshot/property/fixtures/harness/
          # release (non-network) / security when present. Network tests are
          # deselected by default once PR #12's marker is on the tree.
          # Windows legs include tests/security (D-TL-19 / SR-013 PATH-hijack)
          # when those tests exist; pytest discovers them from tests/.
          python -m coverage run --parallel-mode -m pytest tests -rs --hypothesis-seed="${HYPOTHESIS_SEED}"
          python -m coverage combine
          python -m coverage json -o coverage.json
          python -m coverage report --show-missing
      - name: Coverage gate (90/85 overall; 95 branch on critical modules when present)
        run: python scripts/ci/check_coverage.py coverage.json

  test-macos:
    # Blocking since D-TL-34 (TL decision, owner-activated; supersedes
    # D-TL-30): every macOS leg runs on every event, pull_request included,
    # and is in the `ci` aggregate's needs, so a failed, cancelled or skipped
    # leg fails the required check. Same install and test steps as the
    # non-Windows `test` legs.
    name: test-macos (${{ matrix.python-version }})
    needs: [lockfile]
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          # Official sha256 from https://github.com/astral-sh/uv/releases/download/0.13.7/sha256.sum
          # for the archive this runner downloads. A missing OS/arch key yields
          # a sentinel that fails verification rather than skipping the check.
          checksum: ${{ fromJSON('{"Linux-X64":"c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83","Windows-X64":"0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021","macOS-ARM64":"81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731","macOS-X64":"20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7"}')[format('{0}-{1}', runner.os, runner.arch)] || 'MISSING_UV_CHECKSUM' }}
          enable-cache: false
      # Test/test-macos only (contents: read, no secrets or id-token).
      # Restore on pull_request; restore and save on push, schedule, and
      # workflow_dispatch. Key is runner.os, runner.arch, UV_VERSION, the
      # Python version, and hashFiles of the committed lockfiles. uv does
      # not re-hash wheels from its cache; cache integrity relies on
      # GitHub cache scoping (PR runs restore only; only
      # main/schedule/dispatch runs save). Installs still use
      # --require-hashes and --only-binary=:all:. UV_CACHE_DIR is set on
      # the install steps (runner.* is not available in job env).
      - name: Restore the uv package cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/uv-pkg-cache
          key: uv-test-${{ runner.os }}-${{ runner.arch }}-uv${{ env.UV_VERSION }}-${{ matrix.python-version }}-${{ hashFiles('requirements/build.txt', 'requirements/dev.txt') }}
      - name: Restore and save the uv package cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/uv-pkg-cache
          key: uv-test-${{ runner.os }}-${{ runner.arch }}-uv${{ env.UV_VERSION }}-${{ matrix.python-version }}-${{ hashFiles('requirements/build.txt', 'requirements/dev.txt') }}
      - name: Report the default runner git version
        run: git --version
      - name: Install hashed locks with uv
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-pkg-cache
        run: |
          uv pip install --python "$(command -v python)" --require-hashes --no-deps --only-binary=:all: -r requirements/build.txt -r requirements/dev.txt
      - name: Install the package (no deps, no build isolation)
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-pkg-cache
        run: |
          uv pip install --python "$(command -v python)" --no-deps --no-build-isolation -e .
      - name: Confirm no PyPI PyYAML in this environment
        run: python scripts/ci/check_no_pypi_yaml.py
      - name: pytest with coverage (offline paths, fixed seed)
        run: |
          python -c "import pathlib, sysconfig; pathlib.Path(sysconfig.get_path('purelib')).joinpath('coverage_startup.pth').write_text('import coverage; coverage.process_startup()\\n')"
          export COVERAGE_PROCESS_START="${PWD}/pyproject.toml"
          python -m coverage run --parallel-mode -m pytest tests -rs --hypothesis-seed="${HYPOTHESIS_SEED}"
          python -m coverage combine
          python -m coverage json -o coverage.json
          python -m coverage report --show-missing
      - name: Coverage gate (90/85 overall; 95 branch on critical modules when present)
        run: python scripts/ci/check_coverage.py coverage.json

  build:
    name: build
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned pip, then the build lock
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements/build.txt
      - name: python -m build --no-isolation
        run: python -m build --no-isolation

  vendor-network:
    name: vendor-network
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned pip, then hashed locks
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements/build.txt -r requirements/dev.txt
      - name: Install the package (no deps, no build isolation)
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Confirm no PyPI PyYAML in this environment
        run: python3 scripts/ci/check_no_pypi_yaml.py
      # tests/release is on main (#12). test_vendor_manifest is marked network
      # and fetches the pinned sdist; this job has network.
      - name: Network vendor checks (pytest -m network tests/release)
        run: python -m pytest -m network tests/release --hypothesis-seed="${HYPOTHESIS_SEED}"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # run_gitleaks.py extracts with tarfile filter='data' (PEP 706, 3.12+)
          python-version: "3.12"
      - name: Run checksum-pinned gitleaks
        run: python3 scripts/ci/run_gitleaks.py

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: OSV scan of lockfiles and vendored PyYAML 6.0.3
        run: python3 scripts/ci/check_dependency_vulns.py


  git-minimum:
    name: git-minimum
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Tech Lead (D-TL-18): minimum supported git is 2.30, latest 2.30.x.
    # sha256 verified against https://www.kernel.org/pub/software/scm/git/sha256sums.asc
    # (git-2.30.9.tar.xz). The installer reads only these env vars.
    env:
      GIT_MIN_VERSION: "2.30.9"
      GIT_MIN_SHA256: "4e3985a641d9ebdfec9e56b370cdbe362a672d9b45270c1acb1406cdab0f5bb4"
      # Kernel.org checksum autosigner (not Junio C Hamano). See scripts/ci/keys/.
      GIT_MIN_SIGNER_FPR: "B8868C80BA62A1FFFAF5FDA9632D3A06589DA6B1"
    # Digest of python:3.12-bookworm (index digest from registry-1.docker.io;
    # linux/amd64 manifest sha256:3c3ba8ad4c85eb63b7568f806434f14e33370056985da7fdf2673621cb1d7e93).
    # Python 3.12+ is required for tarfile filter='data' (L-7). Bookworm keeps
    # the compiler toolchain stable for the 2.30.9 source build.
    container:
      image: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267 # 3.12-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Git build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates gettext gnupg libcurl4-openssl-dev \
            libexpat1-dev libssl-dev make zlib1g-dev
      - name: GPG-verify and build checksum-pinned minimum Git
        run: python3 scripts/ci/install_git_min.py
      - name: Confirm PATH git is the pinned minimum
        run: |
          command -v git
          git --version
          expected="git version ${GIT_MIN_VERSION}"
          if [ "$(git --version)" != "$expected" ]; then
            echo "expected ${expected}" >&2
            exit 1
          fi
      - name: Install hash-pinned pip, then hashed locks
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements/build.txt -r requirements/dev.txt
      - name: Install the package (no deps, no build isolation)
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: pytest against the minimum Git (offline suite)
        run: python -m pytest tests --hypothesis-seed="${HYPOTHESIS_SEED}"



  mutation:
    # Report-only since D-TL-29: not in the `ci` aggregate's needs.
    # Needs SR review: new dependency mutmut==3.8.1, separate hashed lock.
    # GATES.md / D-TL-17: overall ≥80%, critical modules ≥90% when present.
    # Runs only on the weekly schedule (owner decision 2026-11-13): a full
    # run does not fit a per-PR budget. Not on pull_request, push, the
    # nightly, or workflow_dispatch.
    name: mutation
    if: github.event_name == 'schedule' && github.event.schedule == '41 7 * * 1'
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache input: do not share a pip/setup-python cache with any
      # release or publish job. PyPI PyYAML is allowed only in this job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned pip, then the mutation lock
        run: |
          python3 scripts/ci/install_pinned_pip.py
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements/mutation.txt
      - name: Install the package (no deps, no build isolation)
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Vendored yaml isolation (PyPI PyYAML is installed here)
        env:
          PYTHONPATH: scripts/ci
        run: python3 scripts/ci/check_mutation_yaml.py
      - name: Mutation gate (80 overall / 90 critical; needs SR review)
        env:
          PYTHONPATH: scripts/ci
        run: python3 scripts/ci/check_mutation.py


  ci:
    name: ci
    if: always()
    needs:
      - pin-lint
      - dco
      - lockfile
      - lint
      - types
      - test
      - build
      - vendor-network
      - git-minimum
      # mutation is report-only (D-TL-29, TL decision) and runs only on
      # the weekly schedule; it is not part of the required aggregate.
      # test-macos is blocking (D-TL-34, supersedes D-TL-30) and runs on
      # every event; a skipped test-macos fails this aggregate.
      - test-macos
      - secret-scan
      - dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: All required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          event = os.environ.get("EVENT_NAME", "")
          ref = os.environ.get("GITHUB_REF", "")
          failed = []
          for name, data in needs.items():
              result = data.get("result")
              # dco may be skipped only on refs/heads/main for push,
              # schedule, or workflow_dispatch. A skipped dco on any
              # other event or ref (including workflow_dispatch on a
              # PR branch) is a gate bypass and fails this aggregate.
              # Every other required job must succeed.
              if result == "success":
                  continue
              if (
                  name == "dco"
                  and result == "skipped"
                  and ref == "refs/heads/main"
                  and event in ("push", "schedule", "workflow_dispatch")
              ):
                  continue
              failed.append(f"{name}={result}")
          if failed:
              print("required jobs not green:", ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          print("ok: required CI jobs passed")
          PY
